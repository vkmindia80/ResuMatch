[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=70

markers =
    auth: Authentication tests
    profile: Profile tests
    jobs: Job description tests
    resumes: Resume generation tests
    interviews: Interview prep tests
    integration: Integration tests
    slow: Slow running tests
